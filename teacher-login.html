  /* ── BursarIQ Login Page – Mobile/iOS/Android Polish ── */
  html {
    overflow-x: hidden;

  }
  body {
    overflow-x: hidden;
    overflow-y: auto !important;
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-overflow-scrolling: touch;
    /* Allow scroll when virtual keyboard shrinks viewport */
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: flex-start !important;
  }
  /* Centre card, allow scroll on short screens */
  body > .relative, body > div {
    flex: 0 0 auto;
    width: 100%;
  }
  /* iOS: prevent auto-zoom when tapping inputs */
  @media (hover: none) and (pointer: coarse) {
    input, select, textarea { font-size: 16px !important; }
  }
  * { -webkit-tap-highlight-color: transparent; }
  input, select, button, a { touch-action: manipulation; }
  /* Scroll room on very short viewports (virtual keyboard) */
  @media (max-height: 640px) {
    body { padding: 20px 16px 32px !important; justify-content: flex-start !important; }
  }
</style>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script>
    // Eye toggle
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const pwdInput = document.getElementById('teacherPassword');
    const eyeIcon = document.getElementById('eyeIcon');
    toggleBtn.addEventListener('click', () => {
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeIcon.className = 'far fa-eye-slash';
      } else {
        pwdInput.type = 'password';
        eyeIcon.className = 'far fa-eye';
      }
    });

    // Form submission
    const form = document.getElementById('teacherLoginForm');
    const alertBox = document.getElementById('loginAlert');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      alertBox.className = 'hidden';
      
      const phone = document.getElementById('teacherPhone').value.trim();
      const password = document.getElementById('teacherPassword').value.trim();

      if (!window.RichVineDB || !window.RichVineDB.authenticateTeacher) {
        alertBox.className = 'p-3 rounded-lg text-xs font-medium bg-red-950/80 border border-red-500/50 text-red-200 block';
        alertBox.textContent = 'System database not initialized. Please refresh.';
        return;
      }

      const res = window.RichVineDB.authenticateTeacher(phone, password);
      if (res && res.success) {
        sessionStorage.setItem('bursariq_teacher_session', JSON.stringify(res.teacher));
        alertBox.className = 'p-3 rounded-lg text-xs font-medium bg-emerald-950/80 border border-emerald-500/50 text-emerald-200 block';
        alertBox.innerHTML = '<i class="fas fa-check-circle mr-1"></i> Login successful! Redirecting...';
        setTimeout(() => {
          window.location.href = 'teacher-portal.html';
        }, 600);
      } else {
        alertBox.className = 'p-3 rounded-lg text-xs font-medium bg-red-950/80 border border-red-500/50 text-red-200 block';
        alertBox.innerHTML = '<i class="fas fa-exclamation-triangle mr-1"></i> ' + (res.message || 'Invalid credentials');
      }
    });

    // Live Clock Updater
    function updateClock() {
      const now = new Date();
      const dateStr = now.toLocaleDateString("en-GB", { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
      const timeStr = now.toLocaleTimeString("en-GB", { hour12: true });
      const clockEl = document.getElementById("teacher-clock-time");
      if (clockEl) {
        clockEl.textContent = `${dateStr} • ${timeStr}`;
      }
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
